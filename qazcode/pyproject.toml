[project]
name = "qazcode"
version = "0.1.0"
description = "Medical diagnosis API with RAG-based protocol search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework & ASGI server
    "fastapi>=0.117.1",
    "granian>=2.7.1",
    # HTTP client (used for Ollama error handling)
    "httpx>=0.27.0",
    # Async utilities
    "anyio>=4.0.0",
    # Settings & validation
    "pydantic>=2.11.7",
    "pydantic-settings>=2.13.1",
    # Vector search & embeddings
    "faiss-cpu>=1.13.2",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    # LLM client
    "ollama>=0.6.1",
    # Configuration
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "granian[reload]>=2.7.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # PEP 8 naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "S",     # bandit (security)
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["qazcode"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
